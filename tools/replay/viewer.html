<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSC Loop Closure Report</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23d9480f%22/%3E%3C/svg%3E">
<style>
:root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1f22; --muted: #6a6f76; --line: #d9dbde; --accent: #2f6fdf;
    --gsc: #d9480f; --ivan: #1971c2; --gt: #2b2f36; --edge-ok: #2b8a3e; --edge-bad: #c92a2a; --edge-other: #e8a317;
    --robot: #111111; --plan: #8f3fd1; --src: #e8590c; --tgt: #1c7ed6; --map-bg: #ffffff;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #131517; --panel: #1c1f22; --ink: #e6e8ea; --muted: #9aa1a9; --line: #33383d; --accent: #6ea8ff;
        --gsc: #ff8a4c; --ivan: #4dabf7; --gt: #f1f3f5; --edge-ok: #51cf66; --edge-bad: #ff6b6b; --edge-other: #ffd43b;
        --robot: #f1f3f5; --plan: #c084fc; --src: #ff922b; --tgt: #4dabf7; --map-bg: #101214;
    }
}
:root[data-theme="dark"] {
    --bg: #131517; --panel: #1c1f22; --ink: #e6e8ea; --muted: #9aa1a9; --line: #33383d; --accent: #6ea8ff;
    --gsc: #ff8a4c; --ivan: #4dabf7; --gt: #f1f3f5; --edge-ok: #51cf66; --edge-bad: #ff6b6b; --edge-other: #ffd43b;
    --robot: #f1f3f5; --plan: #c084fc; --src: #ff922b; --tgt: #4dabf7; --map-bg: #101214;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, sans-serif; }
header, section { max-width: 1400px; margin: 0 auto; padding: 12px 16px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; flex: 1; }
h2 { font-size: 17px; margin: 8px 0; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; }
button, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
label { white-space: nowrap; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 8px 0; }
.scrub { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
.scrub input { flex: 1; min-width: 0; }
.time { font-variant-numeric: tabular-nums; min-width: 9ch; text-align: right; color: var(--muted); }
.maps { display: flex; gap: 10px; flex-wrap: wrap; }
.map { flex: 1 1 380px; min-width: 0; position: relative; }
.map-caption { font: 600 13px/1.3 system-ui, sans-serif; color: var(--fg, inherit); margin-top: 6px; text-align: center; font-variant-numeric: tabular-nums; }
.map canvas { width: 100%; aspect-ratio: 1; max-height: 80vh; display: block; background: var(--map-bg); border: 1px solid var(--line); border-radius: 6px; touch-action: none; }
.map .tag { position: absolute; left: 8px; top: 6px; font-weight: 600; pointer-events: none; }
.legend { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
table { border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 3px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
.summary { overflow-x: auto; }
details { margin-top: 10px; }
summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
details.rec { margin-top: 0; }
details.rec > summary h2 { display: inline; }
details.results .summary, details.results .table-wrap { margin: 6px 0 10px; }
details.results h3 { font-size: 13px; margin: 10px 0 4px; }
.loops { display: flex; gap: 12px; flex-wrap: wrap; }
.loop-list { flex: 1 1 520px; min-width: 0; max-height: 520px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.loop-list tr { cursor: pointer; }
.loop-list tr.sel td { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.loop-list thead th { position: sticky; top: 0; background: var(--panel); }
.loop-detail { flex: 1 1 380px; min-width: 0; }
.loop-detail canvas { width: 100%; aspect-ratio: 1.4; background: var(--map-bg); border: 1px solid var(--line); border-radius: 6px; display: block; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 2px 12px; font-size: 12px; margin: 6px 0; }
.kv span { color: var(--muted); }
.muted { color: var(--muted); }
.stale { color: var(--edge-bad); font: 600 11px/1 system-ui, sans-serif; text-transform: none; }
.ok { color: var(--edge-ok); } .bad { color: var(--edge-bad); }
.appendix p, .appendix li { max-width: 75ch; line-height: 1.5; }
.appendix h3 { font-size: 15px; margin: 14px 0 6px; }
.table-wrap, .diagram { overflow-x: auto; margin: 8px 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
.tabs button { font: inherit; padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.appendix th[colspan] { text-align: center; }
td.win { font-weight: 700; }
.note { color: var(--muted); font-size: 13px; }
code { font-size: 12.5px; }
.help { font: 600 10px/1 system-ui, sans-serif; width: 15px; height: 15px; padding: 0; margin-left: 4px; border-radius: 50%; color: var(--muted); background: transparent; border: 1px solid var(--line); vertical-align: 1px; cursor: help; }
.help:hover, .help:focus-visible { color: var(--accent); border-color: var(--accent); }
details.repro { margin-top: 4px; font-size: 12px; color: var(--muted); }
details.repro summary { font-weight: 400; font-size: 11.5px; opacity: 0.7; }
details.repro pre { white-space: pre-wrap; overflow-x: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-size: 11.5px; }
#tip { position: fixed; z-index: 10; max-width: min(360px, calc(100vw - 16px)); padding: 8px 10px; font-size: 12.5px; line-height: 1.45; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 16px rgb(0 0 0 / 0.18); white-space: normal; }
</style>
</head>
<body>
<header>
    <h1 id="title">GSC replays</h1>
    <span class="muted" id="built"></span>
    <button id="theme" title="Theme">Theme: auto</button>
</header>
<main id="main"></main>
<script>
"use strict"
const $ = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag)
    for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") { el.className = v } else if (k.startsWith("on")) { el.addEventListener(k.slice(2), v) } else { el.setAttribute(k, v) }
    }
    for (const kid of kids.flat()) { if (kid != null) { el.append(kid) } }
    return el
}
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim()
const fmt = (v, d = 3) => v == null ? "–" : typeof v === "number" ? (Number.isInteger(v) ? String(v) : v.toFixed(d)) : String(v)
const clock = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`
// metric explanations, shown by every (?) button (data-tip = space-separated keys here); report_sections.py's tables use the same keys
const TIPS = {
    gt: "Per keyframe: the distance (x, y and z) between where the method's map puts the robot and where ground truth puts it, after one best-fit rotation and shift of the whole finished path onto ground truth. The same fit is applied to final, live and raw, so all three are judged in one frame. Shown: the median over keyframes. Drift grows along a loop, so early keyframes are close and late ones far; p95 shows that tail.",
    final: "Final: where the finished pose graph puts each keyframe at the end of the run.",
    live: "Live: where the method had the robot at the moment that keyframe was made (the newest correction then, applied to its odometry). This is what the planner navigates with.",
    raw: "Raw odometry: the odometry alone, with no loop closure, scored the same way. The baseline both methods should beat.",
    tags: "How far repeat sightings of the same AprilTag land from each other (RMS, metres) when each sighting is placed with the method's pose. Needs no ground truth and no alignment; 0 = a perfectly consistent map.",
    shade: "Shading compares with raw odometry. Green: the share of raw odometry\u2019s error the method removed (deep green = all of it). Red: how much worse than raw in absolute terms (deep red = 1 m worse), so a 2 cm loss barely shows.",
    speed: "Recording length divided by replay wall time. Above 1x is faster than real time; GSC replays every scan in lockstep, as fast as the machine allows.",
    dropped: "Scans the method never processed because it was busy when they arrived (Ivan keeps only the newest scan while busy; GSC queues them).",
    busy: "Share of wall time Ivan's module spent processing.",
    st0: "Stage 0, keyframing and compute: deciding which scans become keyframes, and keeping the work bounded (scan queue, one search and one solve at a time). Says nothing about whether a loop is real.",
    st1: "Stage 1, uniqueness: is this scan distinctive enough to match at all? Looks only at the scan itself (how many scan-context cells it fills, whether its surfaces constrain every direction), before any candidate is considered.",
    st2: "Stage 2, connection discovery: which earlier keyframe might this be? Proposes candidates cheaply (scan-context descriptor search, or the nearest keyframe by position); nothing is verified yet.",
    st3: "Stage 3, connection fit quality: do the two clouds actually line up? ICP aligns the scan to the candidate's submap and scores the fit. Uses only the two clouds, not the pose graph.",
    st4: "Stage 4, proportional confidence: is the fit convincing enough for how far it would move the map? Weighs the match's evidence (yank units) against a bar: its yank (bigger corrections need more proof), how many look-alike places exist, and the solver's recent record. A clear pass or fail decides on the single scan; in between, the match is extended one more scan at a time until it leaves the uncertainty range.",
    st5: "Stage 5, big-picture fit: do the closures agree with each other and the odometry? A batch pose-graph solve over every committed closure (GNC, then Huber) keeps the consistent set and votes the rest out; it is the only stage that moves the map.",
    o_lowocc: "low_occupancy (stage 1): the scan fills too few scan-context cells to be distinctive.",
    o_nocand: "no_candidate (stage 2): no scan-context match under the threshold and no keyframe within the position search radius.",
    o_outranked: "outranked (stage 0): a better-ranked proposal took the single waiting slot while the search thread was busy.",
    o_degen: "degeneracy_reject (stage 1): the scan's surfaces leave some direction unconstrained (a corridor, a flat floor), so ICP could slide along it.",
    o_icp: "icp_reject (stage 3): ICP did not converge, or its fitness (inlier error over overlap) was too high.",
    o_uninf: "uninformative (stage 4, after ICP): ICP's variance is no tighter than what the graph already knows between the two keyframes, in every direction, so it would add nothing.",
    o_yank: "yank_confidence_reject (stage 4): the evidence did not clear the bar for how far the closure would move the map: far short on the single scan, or still short after extending (the median over the extra scans fell to the bottom of the uncertainty range, or the scans ran out below the bar).",
    o_rejected: "rejected (stage 5): committed, but the pose-graph solve voted it out as inconsistent with the other closures and odometry. Re-judged at every solve.",
    o_applied: "applied (stage 5): kept by the solve; the map moves to agree with it.",
    cb_found: "Every place the robot thought it might be revisiting: for each new keyframe, the earlier keyframe whose scan looked most alike (and, at higher pressure, a few runners-up). Most of these are wrong guesses; the gates below sort them out.",
    cb_icp: "Guesses thrown out because the two scans would not line up: the alignment did not settle, the fit was poor, or the scan was too featureless (a long wall or a flat floor) to pin down where it is.",
    cb_uninformative: "Guesses that did line up, but told the map nothing new: the odometry (or an earlier loop) already knew how these two places relate at least as well as this match could.",
    cb_confidence: "Guesses that lined up but were not convincing enough for how far they would move the map. A small nudge needs little proof; a big jump needs a lot, more if several places look alike or recent loops have been bad. Fitting more scans from the robot's recent path, each on its own, can earn the extra proof.",
    cb_edges: "Loops that passed every check and went into the map. Green: the map now agrees with them. Red: the final map-wide check threw them out because they disagreed with everything else. Yellow: waiting for that check.",
    cb_gt: "Ground truth: the best available reference map, shown in grey on top, to compare against.",
    cb_path: "The robot's path as this method places it.",
    cb_plan: "The path planner's route on this method's map, around its biggest loop closure.",
}
const help = (...keys) => $("button", { class: "help", type: "button", "data-tip": keys.join(" "), "aria-label": "explain" }, "?")
document.addEventListener("click", event => {
    const button = event.target.closest(".help")
    let tip = document.getElementById("tip")
    if (!button) { if (tip && !event.target.closest("#tip")) { tip.hidden = true } return }
    if (!tip) { tip = $("div", { id: "tip", role: "tooltip" }); document.body.append(tip) }
    const same = !tip.hidden && tip.dataset.for === button.dataset.tip && tip.anchor === button
    tip.hidden = same
    if (same) { return }
    tip.textContent = button.dataset.tip.split(" ").map(key => TIPS[key] || "").join(" ")
    tip.dataset.for = button.dataset.tip; tip.anchor = button
    const box = button.getBoundingClientRect()
    tip.style.left = `${Math.max(8, Math.min(innerWidth - Math.min(360, innerWidth - 16) - 8, box.left - 20))}px`
    tip.style.top = `${box.bottom + 6}px`
})
addEventListener("scroll", () => { const tip = document.getElementById("tip"); if (tip) { tip.hidden = true } }, { passive: true })
// cell shading, same scale as report_sections.py: score in [-1, 1], green = good, red = bad
function shade(score) {
    if (score == null || !isFinite(score)) { return "" }
    score = Math.max(-1, Math.min(1, score))
    return `background: color-mix(in srgb, var(${score > 0 ? "--edge-ok" : "--edge-bad"}) ${Math.round(Math.abs(score) * 45)}%, transparent)`
}
// against raw odometry (as report_sections.py): better = share of raw's error removed (all = 1); worse = metres added (1 m = -1)
function vsRaw(value, raw) { return value == null || !raw ? null : value <= raw ? (raw - value) / raw : -(value - raw) / 1.0 }
async function fetchText(path) { const r = await fetch(path); if (!r.ok) { throw new Error(`${path}: ${r.status}`) } return r.text() }
async function fetchB64(path) {
    const text = await fetchText(path), bin = atob(text.trim()), bytes = new Uint8Array(bin.length)
    for (let i = 0; i < bin.length; i++) { bytes[i] = bin.charCodeAt(i) }
    return bytes.buffer
}
// binary search: number of sorted values <= x
function countLE(values, x) { let lo = 0, hi = values.length; while (lo < hi) { const m = (lo + hi) >> 1; if (values[m] <= x) { lo = m + 1 } else { hi = m } } return lo }
// SE2 helpers: pose = [x, y, yaw]
const compose = (a, b) => { const c = Math.cos(a[2]), s = Math.sin(a[2]); return [a[0] + c * b[0] - s * b[1], a[1] + s * b[0] + c * b[1], a[2] + b[2]] }
const invert = a => { const c = Math.cos(a[2]), s = Math.sin(a[2]); return [-c * a[0] - s * a[1], s * a[0] - c * a[1], -a[2]] }

// ---------- theme ----------
const themes = ["auto", "light", "dark"]
let theme = "auto"
try { theme = localStorage.getItem("pgo-theme") || "auto" } catch (e) { }
function applyTheme() {
    if (theme === "auto") { delete document.documentElement.dataset.theme } else { document.documentElement.dataset.theme = theme }
    document.getElementById("theme").textContent = `Theme: ${theme}`
    for (const r of recordings) { r.redraw() }
}
document.getElementById("theme").onclick = () => {
    theme = themes[(themes.indexOf(theme) + 1) % 3]
    try { localStorage.setItem("pgo-theme", theme) } catch (e) { }
    applyTheme()
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme())

// ---------- data decoding ----------
function decodePoints(buffer, n) {
    const counts = new Uint32Array(buffer.slice(0, 4 * n)), xy = new Int16Array(buffer.slice(4 * n))
    const start = new Uint32Array(n + 1)
    for (let i = 0; i < n; i++) { start[i + 1] = start[i] + counts[i] }
    return { start, xy }
}
function decodeStates(buffer, scale) {
    const view = new DataView(buffer), states = []
    let at = 0
    while (at < buffer.byteLength) {
        const ts = view.getFloat64(at, true), n = view.getUint32(at + 8, true)
        const raw = new Int16Array(buffer.slice(at + 12, at + 12 + 6 * n)), pose = new Float32Array(3 * n)
        for (let i = 0; i < n; i++) { pose[3 * i] = raw[3 * i] * scale; pose[3 * i + 1] = raw[3 * i + 1] * scale; pose[3 * i + 2] = raw[3 * i + 2] / 32767 * Math.PI }
        states.push({ ts, n, pose })
        at += 12 + 6 * n
    }
    return states
}
function decodeIcp(buffer) {
    const view = new DataView(buffer), stages = []
    let at = 4
    const cloud = () => {
        const offset = [view.getFloat32(at, true), view.getFloat32(at + 4, true), view.getFloat32(at + 8, true)], n = view.getUint32(at + 12, true)
        const raw = new Int16Array(buffer.slice(at + 16, at + 16 + 6 * n)), xyz = new Float32Array(3 * n)
        for (let i = 0; i < 3 * n; i++) { xyz[i] = raw[i] / 100 + offset[i % 3] }
        at += 16 + 6 * n
        return xyz
    }
    for (let k = view.getUint32(0, true); k > 0; k--) {
        const keyframes = view.getUint32(at, true), tail = []
        for (let i = 0; i < 13; i++) { tail.push(view.getFloat64(at + 4 + 8 * i, true)) }
        at += 4 + 104
        const source = cloud(), target = cloud()
        stages.push({ keyframes, rotation: tail.slice(0, 9), translation: tail.slice(9, 12), fitness: tail[12], source, target })
    }
    return stages
}

// ---------- one method's belief at time t ----------
class Method {
    constructor(key, meta, states, points) {
        Object.assign(this, { key, meta, states, points })
        this.kfTs = meta.kf_ts
        this.stateTs = states.map(s => s.ts)
        this.plan = null
    }
    // keyframe poses as believed at t (Float32Array 3n) for the first n keyframes made by then
    belief(t) {
        const n = countLE(this.kfTs, t), si = countLE(this.stateTs, t) - 1, raw = this.meta.raw, out = new Float32Array(3 * n)
        let correction = [0, 0, 0], m = 0
        if (si >= 0) {
            const s = this.states[si]
            m = Math.min(n, s.n)
            out.set(s.pose.subarray(0, 3 * m))
            const j = s.n - 1
            correction = compose([s.pose[3 * j], s.pose[3 * j + 1], s.pose[3 * j + 2]], invert(raw[j]))
        }
        for (let i = m; i < n; i++) { const p = compose(correction, raw[i]); out[3 * i] = p[0]; out[3 * i + 1] = p[1]; out[3 * i + 2] = p[2] }
        return { n, poses: out, correction, state: si }
    }
    gtPoses(n) {
        if (!this.meta.gt) { return null }
        const out = new Float32Array(3 * n).fill(NaN)
        for (let i = 0; i < n; i++) { const g = this.meta.gt[i]; if (g) { out[3 * i] = g[0]; out[3 * i + 1] = g[1]; out[3 * i + 2] = g[2] } }
        return out
    }
}

// ---------- recording section ----------
// the left ("gsc") and right ("ivan") runs' names, from report.json "labels"
const SIDE = { gsc: "A", ivan: "B" }
const recordings = []
const groups = {}
// candidate stages the map can show: key, checkbox label, colour, the outcomes it covers (null = every candidate with a target)
const STAGES = [
    ["found", "discovered", "#868e96", null],
    ["icp", "ICP rejected", "#f76707", ["icp_reject", "degeneracy_reject"]],
    ["uninformative", "uninformative", "#4c6ef5", ["uninformative"]],
    ["confidence", "confidence rejected", "#ae3ec9", ["yank_confidence_reject"]],
]
class Recording {
    constructor(info) {
        this.info = info
        this.t = 0; this.playing = false; this.speed = 30
        this.show = { mode: innerWidth > 900 ? "both" : "gsc", gt: false, edges: true, path: true, plan: true, found: false, icp: false, uninformative: false, confidence: false }
        this.view = null; this.selected = null
        // everything under the label folds away; open by default
        this.body = $("details", { class: "rec", open: "" }, $("summary", {}, $("h2", {}, info.label)), $("p", { class: "muted" }, "loading…"))
        this.body.addEventListener("toggle", () => { if (this.body.open) { this.redraw() } })
        this.el = $("section", { id: `rec-${info.name}` }, this.body)
        if (info.group) {
            // recordings sharing a group (one recording run several ways) show as tabs, one at a time
            let group = groups[info.group]
            if (!group) {
                group = groups[info.group] = { bar: $("div", { class: "tabs", role: "tablist" }), members: [] }
                group.el = $("section", { class: "group" }, $("h2", {}, info.group), group.bar)
                document.getElementById("main").append(group.el)
            }
            const button = $("button", { type: "button", role: "tab" }, info.tab || info.label)
            button.addEventListener("click", () => {
                for (const m of group.members) { m.rec.el.hidden = m.rec !== this; m.button.setAttribute("aria-selected", String(m.rec === this)) }
                this.redraw()
            })
            group.members.push({ rec: this, button })
            group.bar.append(button)
            group.el.append(this.el)
            // shown first: the "Ideal trust" tab when the group has one, else the first
            const shown = group.members.find(m => /^ideal/i.test(m.rec.info.tab || "")) || group.members[0]
            for (const m of group.members) { m.rec.el.hidden = m !== shown; m.button.setAttribute("aria-selected", String(m === shown)) }
        } else {
            document.getElementById("main").append(this.el)
        }
        recordings.push(this)
    }
    redraw() { if (this.methods) { this.draw() } }
    async load() {
        const base = `${this.info.name}/`
        try {
            const meta = this.meta = JSON.parse(await fetchText(base + "meta.json"))
            this.methods = {}
            for (const [key, m] of Object.entries(meta.methods)) {
                const [sb, pb] = await Promise.all([fetchB64(base + m.states), fetchB64(base + m.points)])
                this.methods[key] = new Method(key, m, decodeStates(sb, m.xy_scale), decodePoints(pb, m.keyframes))
            }
            for (const [key, file] of Object.entries(meta.plan || {})) {
                try { if (this.methods[key]) { this.methods[key].plan = JSON.parse(await fetchText(base + file)) } } catch (e) { console.warn(e) }
            }
            // the end-of-run solve lands at the last keyframe's time, which can sit a hair past the rounded duration

                ctx.font = `${12 * dpr}px system-ui`; ctx.fillText(`learned odometry error estimate vs stated: translation ×${f(xy)} (z ×${f(z)}), heading ×${f(yaw)} (tilt ×${f(tilt)})`, W - 10 * dpr, line * dpr)
                line += 18
            }
            // the newest ICP extension at t: keyframes stitched each side and the clouds' point counts
            if (col && col.extended_source_points != null) {
                const rows = m.extensions || (m.extensions = L.diag.filter(r => r[col.extended_keyframes] > 0 && r[col.source_time] != null))
                const r = rows[countLE(m.extensionTs || (m.extensionTs = rows.map(r => r[col.source_time])), this.t) - 1]
                const extension = r ? `ICP extension ${r[col.extended_keyframes]}/${r[col.extension_budget]} kf, ${r[col.extended_source_points].toLocaleString()} → ${r[col.extended_target_points].toLocaleString()} pts` : "ICP extension: none yet"
                ctx.font = `${12 * dpr}px system-ui`; ctx.fillText(extension, W - 10 * dpr, line * dpr)
            }
            ctx.textAlign = "left"
        }
        // scale bar
        const meters = [1, 2, 5, 10, 20, 50, 100, 200].find(s => s * k > W / 8) || 500
        ctx.fillStyle = colors.muted; ctx.fillRect(12 * dpr, H - 14 * dpr, meters * k, 3 * dpr)
        ctx.font = `${11 * dpr}px system-ui`; ctx.fillText(`${meters} m`, 12 * dpr, H - 20 * dpr)
    }
    // ---------- loop analysis ----------
    loopSection() {
        const L = this.meta.loops, col = Object.fromEntries(L.diag_columns.map((c, i) => [c, i]))
        const outcomes = [...new Set(L.diag.map(r => r[0]))]
        const filter = $("select", { "aria-label": "filter by outcome" }, $("option", { value: "*" }, "all outcomes"), $("option", { value: "clouds" }, "with ICP clouds"),
            $("option", { value: "rejected" }, "all rejects"), ...outcomes.map(o => $("option", { value: o }, `${o} (${L.diag.filter(r => r[0] === o).length})`)))
        filter.value = "clouds"
        const shown = ["#", "outcome", "src→tgt", "t", "dist m", "fitness", "overlap", "degen.", "conf / req", "yank stdevs", "ext fit", "ICP"]
        const tbody = $("tbody")
        const list = $("div", { class: "loop-list" }, $("table", {}, $("thead", {}, $("tr", {}, ...shown.map(h => $("th", {}, h)))), tbody))
        const detail = $("div", { class: "loop-detail" }, $("p", { class: "muted" }, "Pick a candidate to see its gate numbers and ICP clouds."))
        const render = () => {
            tbody.replaceChildren()
            const f = filter.value
            const rows = L.diag.map((r, i) => [r, i]).filter(([r, i]) => f === "*" || (f === "clouds" ? L.icp[i] : f === "rejected" ? r[0].endsWith("_reject") : r[0] === f))
            for (const [r, i] of rows.slice(0, 2000)) {
                const cls = r[0] === "accepted" ? "ok" : r[0].endsWith("_reject") ? "bad" : "muted"
                const tr = $("tr", { onclick: () => { for (const x of tbody.children) { x.classList.remove("sel") } tr.classList.add("sel"); this.showLoop(i, detail) } },
                    $("td", {}, String(i)), $("td", { class: cls }, r[0]), $("td", {}, `${r[col.source_id]}→${r[col.target_id]}`), $("td", {}, r[col.source_time] == null ? "–" : clock(r[col.source_time])),
                    $("td", {}, fmt(r[col.candidate_distance], 2)), $("td", {}, fmt(r[col.icp_fitness], 3)), $("td", {}, fmt(r[col.icp_overlap], 2)), $("td", {}, fmt(r[col.degeneracy_min], 3)),
                    $("td", {}, r[col.confidence] == null ? "–" : `${fmt(r[col.confidence], 2)} / ${fmt(r[col.required_confidence], 2)}`), $("td", {}, fmt(r[col.yank_stdevs], 2)),
                    $("td", {}, fmt(r[col.extended_fitness], 3)), $("td", {}, L.icp[i] ? "●" : ""))
                tbody.append(tr)
            }
            if (rows.length > 2000) { tbody.append($("tr", {}, $("td", { colspan: shown.length }, `… ${rows.length - 2000} more, narrow the filter`))) }
        }
        filter.onchange = render
        const details = $("details", {}, $("summary", {}, `Loop analysis (${L.diag.length} candidates, ICP clouds for ${Object.keys(L.icp).length})`),
            $("div", { class: "controls" }, filter, $("span", { class: "muted" }, `gate: ICP fitness ≤ ${fmt(L.thresholds.icp_fitness)}, degeneracy ≥ ${fmt(L.thresholds.degeneracy_min)}, confidence ≥ required`)),
            $("div", { class: "loops" }, list, detail))
        details.addEventListener("toggle", () => { if (details.open && !tbody.children.length) { render() } })
        return details
    }
    async showLoop(i, detail) {
        const L = this.meta.loops, row = L.diag[i], d = Object.fromEntries(L.diag_columns.map((c, j) => [c, row[j]]))
        this.selected = { source: d.source_id, target: d.target_id }
        this.draw()
        const kv = $("div", { class: "kv" }, ...L.diag_columns.filter(c => d[c] != null).map(c => $("div", {}, $("span", {}, c.replaceAll("_", " ") + " "), c === "source_time" ? clock(d[c]) : fmt(d[c], 4))))
        const jump = $("button", { onclick: () => { this.t = Math.min(this.meta.duration_s, d.source_time + 2); this.slider.value = this.t; this.draw() } }, "Show on map")
        detail.replaceChildren($("div", { class: "controls" }, $("b", {}, `#${i} ${d.outcome}: ${d.source_id} → ${d.target_id}`), d.source_time != null ? jump : null), kv)
        const icp = L.icp[String(i)]
        if (!icp) { detail.append($("p", { class: "muted" }, "No ICP clouds exported for this candidate (only accepted + rejects nearest the gate are).")); return }
        detail.append($("table", {}, $("thead", {}, $("tr", {}, ...["round", "src pts", "tgt pts", "fitness", "rot °", "trans m"].map(h => $("th", {}, h)))),
            $("tbody", {}, ...icp.stages.map(s => $("tr", {}, $("td", {}, s.keyframes === 1 ? "single" : `extended ×${s.keyframes}`), $("td", {}, s.source_points), $("td", {}, s.target_points),
                $("td", {}, fmt(s.fitness, 4)), $("td", {}, fmt(s.rotation_deg, 2)), $("td", {}, fmt(s.translation_m, 3)))))))
        const canvas = $("canvas", { role: "img", "aria-label": "ICP clouds" })
        const state = { stage: 0, side: false, aligned: true }
        this.icpFile = this.icpFile || fetchB64(this.info.name + "/icp.b64")
        const stages = decodeIcp((await this.icpFile).slice(icp.offset, icp.offset + icp.length))
        const btn = (label, onclick) => $("button", { onclick: ev => { onclick(); paint(); for (const b of ev.target.parentElement.querySelectorAll("button")) { b.classList.toggle("on", b === ev.target) } } }, label)
        const row1 = $("div", { class: "controls" }, ...stages.map((s, j) => btn(s.keyframes === 1 ? "single" : `extended ×${s.keyframes}`, () => { state.stage = j })))
        const row2 = $("div", { class: "controls" }, btn("after ICP", () => { state.aligned = true }), btn("before", () => { state.aligned = false }))
        const row3 = $("div", { class: "controls" }, btn("top", () => { state.side = false }), btn("side", () => { state.side = true }),
            $("span", { class: "legend" }, $("span", {}, $("span", { class: "sw", style: "background: var(--src)" }), "source"), $("span", {}, $("span", { class: "sw", style: "background: var(--tgt)" }), "target")))
        for (const r of [row1, row2, row3]) { r.querySelector("button").classList.add("on") }
        detail.append(row1, row2, row3, canvas)
        const paint = () => {
            const s = stages[state.stage], dpr = devicePixelRatio || 1, W = Math.round(canvas.clientWidth * dpr), H = Math.round(canvas.clientHeight * dpr)
            canvas.width = W; canvas.height = H
            const ctx = canvas.getContext("2d"), R = s.rotation, T = s.translation
            const src = new Float32Array(s.source.length)
            for (let j = 0; j < s.source.length; j += 3) {
                const x = s.source[j], y = s.source[j + 1], z = s.source[j + 2]
                if (state.aligned) {
                    src[j] = R[0] * x + R[1] * y + R[2] * z + T[0]; src[j + 1] = R[3] * x + R[4] * y + R[5] * z + T[1]; src[j + 2] = R[6] * x + R[7] * y + R[8] * z + T[2]
                } else { src[j] = x; src[j + 1] = y; src[j + 2] = z }
            }
            const a = 0, b = state.side ? 2 : 1
            // frame the 2nd..98th percentile so a few far points do not shrink the clouds
            const along = axis => { const v = []; for (const c of [s.target, src]) { for (let j = axis; j < c.length; j += 3) { v.push(c[j]) } } v.sort((p, q) => p - q); return [v[Math.floor(v.length * 0.02)], v[Math.floor(v.length * 0.98)]] }
            const [x0, x1] = along(a), [y0, y1] = along(b)
            const k = Math.min(W / (x1 - x0 + 1), H / (y1 - y0 + 1)), ox = W / 2 - (x0 + x1) / 2 * k, oy = H / 2 + (y0 + y1) / 2 * k
            ctx.fillStyle = css("--map-bg"); ctx.fillRect(0, 0, W, H)
            const dot = Math.max(2, Math.round(dpr * 2))
            for (const [c, color, alpha] of [[s.target, css("--tgt"), 0.55], [src, css("--src"), 0.8]]) {
                ctx.fillStyle = color; ctx.globalAlpha = alpha
                for (let j = 0; j < c.length; j += 3) { ctx.fillRect(ox + c[j + a] * k, oy - c[j + b] * k, dot, dot) }
            }
            ctx.globalAlpha = 1; ctx.fillStyle = css("--muted"); ctx.font = `${11 * dpr}px system-ui`
            ctx.fillText(`${state.side ? "side (x, z)" : "top (x, y)"} · fitness ${fmt(s.fitness, 4)} · ${s.source.length / 3} src / ${s.target.length / 3} tgt pts shown`, 8 * dpr, 16 * dpr)
        }
        paint()
    }
}

// ---------- boot ----------
fetchText("report.json").then(text => {
    const report = JSON.parse(text)
    Object.assign(SIDE, report.labels || {})
    document.getElementById("title").textContent = report.title || "GSC replays"
    document.title = report.title || document.title
    document.getElementById("built").textContent = (report.built ? `built ${report.built}` : "") + (report.commit ? ` · code ${report.commit}` : "")
    for (const info of report.recordings) { new Recording(info) }
    applyTheme()
    // one at a time, top first, so the first map shows quickly
    return recordings.reduce((chain, r) => chain.then(() => r.load()), Promise.resolve())
}).catch(e => { document.getElementById("main").append($("section", {}, `Could not load report.json (${e.message}). Serve this folder over http.`)) })
</script>
</body>
